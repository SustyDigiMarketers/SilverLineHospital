<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47" />
      <stop offset="50%" stop-color="#163860" />
      <stop offset="100%" stop-color="#0E2A47" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D1BD" />
      <stop offset="100%" stop-color="#00B5A5" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Hospital Grid / Pattern -->
  <circle cx="200" cy="150" r="130" fill="none" stroke="rgba(0, 181, 165, 0.15)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="200" cy="150" r="160" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" />

  <!-- Doctor Silhouette Group -->
  <g transform="translate(0, 10)">
    <!-- Head -->
    <circle cx="200" cy="135" r="54" fill="#E2E8F0" opacity="0.95" />
    
    <!-- Torso / Shoulders with White Lab Coat -->
    <path d="M90 350 C90 240, 130 215, 200 215 C270 215, 310 240, 310 350 Z" fill="url(#coatGrad)" />
    
    <!-- Inner Shirt / Tie -->
    <path d="M180 215 L200 280 L220 215 Z" fill="#0E2A47" />
    <path d="M195 240 L200 295 L205 240 Z" fill="url(#accentGrad)" />

    <!-- Lab Coat Lapels -->
    <path d="M140 215 L180 350 L110 350 Z" fill="#CBD5E1" opacity="0.6" />
    <path d="M260 215 L220 350 L290 350 Z" fill="#CBD5E1" opacity="0.6" />

    <!-- Stethoscope -->
    <path d="M165 200 C165 270, 235 270, 235 200" fill="none" stroke="#00B5A5" stroke-width="6" stroke-linecap="round" />
    <path d="M200 255 L200 290" fill="none" stroke="#00B5A5" stroke-width="5" stroke-linecap="round" />
    <circle cx="200" cy="298" r="9" fill="#0E2A47" stroke="#00B5A5" stroke-width="4" />
  </g>

  <!-- Medical Cross Badge -->
  <g transform="translate(325, 45)">
    <circle cx="0" cy="0" r="22" fill="#0E2A47" stroke="#00B5A5" stroke-width="2.5" />
    <path d="M-4 -11 h8 v7 h7 v8 h-7 v7 h-8 v-7 h-7 v-8 h7 z" fill="#00B5A5" />
  </g>

  <!-- Hospital Brand Label -->
  <text x="200" y="375" text-anchor="middle" fill="rgba(255, 255, 255, 0.75)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    SILVERLINE SPECIALIST
  </text>
</svg>
