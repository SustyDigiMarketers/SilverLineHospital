      content="SilverLine Hospital is Trichy's best and pioneer multi-speciality hospital, offering advanced medical care, expert doctors, and patient-centric services across cardiology, oncology, orthopedics, and more."
    />
    <link rel="canonical" href="https://silverlinehospitals.com/" />
    <link rel="icon" href="/favicon.svg" />

    <!-- Preload Critical Assets -->
    <link rel="preload" as="image" href="/Hero/Home1.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo.svg" />


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Poppins:wght@500;700&display=swap"

      media="print"
      onload="this.media='all'"

    <!-- Critical CSS: Ensures site looks good immediately, even before Tailwind loads -->
    <style>
      /* Reset & Base */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Montserrat", sans-serif;
        overflow-x: hidden;
        width: 100%;
      }
      /* Removed conflicting img height: auto rule */
      img,
      svg,
      video,
      canvas,
      audio,
      iframe,
      embed,
      object {
        display: block;
      }
      img,
      video {
        max-width: 100%;
      }

      /* Layout Utilities */
      .relative {
        position: relative;
      }
      .absolute {
        position: absolute;
      }
      .fixed {
        position: fixed;
      }
      .inset-0 {
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
      .top-0 {
        top: 0;
      }
      .left-0 {
        left: 0;
      }
      .w-full {
        width: 100%;
      }
      .h-full {
        height: 100%;
      }
      .h-screen {
        height: 100vh;
      }
      .z-50 {
        z-index: 50;
      }
      .z-10 {
        z-index: 10;
      }
      .container {
        width: 100%;
        margin-right: auto;
        margin-left: auto;
        padding-right: 1rem;
        padding-left: 1rem;
      }

      /* Flexbox Utilities */
      .flex {
        display: flex;
      }
      .flex-col {
        flex-direction: column;
      }
      .items-center {
        align-items: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .justify-center {
        justify-content: center;
      }
      .justify-end {
        justify-content: flex-end;
      }

      /* Display Utilities */
      .block {
        display: block;
      }
      .hidden {
        display: none !important;
      }

      /* Object Fit */
      .object-cover {
        object-fit: cover;
      }

      /* Text & Decoration */
      a {
        text-decoration: none;
        color: inherit;
      }
      .text-center {
        text-align: center;
      }

      /* Backgrounds */
      .bg-white {
        background-color: #ffffff;
      }

      /* Visibility Fix for Root */
      #root {
        opacity: 1 !important;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Loading Spinner */
      .initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        background-color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #00b5a5; /* Teal */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Responsive Logic (Mirrors Tailwind 'md' breakpoint at 768px) */
      @media (min-width: 768px) {
        .md\:flex {
          display: flex !important;
        }
        .md\:hidden {
          display: none !important;
        }
        .md\:block {
          display: block !important;
        }
        .md\:h-screen {
          height: 100vh;
        }
        .container {
          max-width: 768px;
        }
      }
      @media (min-width: 1024px) {
        .container {
          max-width: 1024px;
        }
      }
      @media (min-width: 1280px) {
        .container {
          max-width: 1280px;
        }
      }
      @media (min-width: 1536px) {
        .container {
          max-width: 1440px;
        }
      }
      @media (min-width: 1920px) {
        .container {
          max-width: 1600px;
        }
      }

      @media (max-width: 767px) {
        .md\:flex {
          display: none !important;
        }
        .md\:hidden {
          display: flex !important;
        }
      }

      /* Mobile Performance Optimizations */
      @media (max-width: 767px) {
        /* Content Visibility: Skips rendering off-screen content. Boosts mobile scrolling. */
        section {
          content-visibility: auto;
          contain-intrinsic-size: 1px 500px;
        }
        
        /* First few sections should always be visible to avoid flash */
        #home, #why-choose-us, #island-bar {
          content-visibility: visible;
        }

        /* Promote frequently moved elements to their own layer */
        nav, header, .fixed, .mobile-nav-pill {
          will-change: transform;
        }

        /* Remove tap highlight delay/effect for snappier mobile feel */
        * {
          -webkit-tap-highlight-color: transparent;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        /* Disable fixed backgrounds on mobile for performance (prevents heavy repaints) */
        .bg-fixed {
          background-attachment: scroll !important;
        }

        /* Smoother scrolling on IOS */
        body {
          -webkit-overflow-scrolling: touch;
          scroll-behavior: smooth;
          text-rendering: optimizeSpeed;
        }

        /* Reduce heavy effects on mobile */
        .backdrop-blur-xl, .backdrop-blur-2xl {
          backdrop-filter: blur(6px) !important;
          -webkit-backdrop-filter: blur(6px) !important;
        }
        
        /* Optimized transition durations for mobile */
        .transition-all, .transition-transform {
          transition-duration: 150ms !important;
        }

        /* Lighter shadows for mobile GPUs */
        .shadow-2xl {
           box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
        }
      }

      /* Marquee Animation for Insurance Partners */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        animation: marquee 30s linear infinite;
      }

      /* Scrollbar - Global Hide */
      html,
      body {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none; /* Chrome, Safari and Opera */
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Polyfill process.env for browser compatibility
      window.process = { env: { NODE_ENV: "production" } };

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#00B5A5",
              secondary: "#0E2A47",
            },
            animation: {
              float: "float 6s ease-in-out infinite",
              "pulse-soft":
                "pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "marquee-y": "marquee-y 30s linear infinite",
            },
            keyframes: {
              "marquee-y": {
                "0%": { transform: "translateY(0)" },
                "100%": { transform: "translateY(-50%)" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
              "pulse-soft": {
                "0%, 100%": { opacity: "1" },
                "50%": { opacity: ".8" },
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
